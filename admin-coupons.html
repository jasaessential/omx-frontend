<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupons — JASA V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-banners.css">
    <link rel="stylesheet" href="admin-coupons.css?v=20260924c">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav>
</aside>

<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
            <span class="ab-page-title"><i class="fa-solid fa-ticket"></i> Coupons</span>
        </div>
        <div class="header-right">
            <a href="index.html" class="header-icon-btn" title="Back to Home"><i class="fa-solid fa-house"></i></a>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="page-wrap ab-wrap">

        <div class="ab-hero">
            <div class="ab-hero-icon"><i class="fa-solid fa-ticket"></i></div>
            <div class="ab-hero-text">
                <div class="ab-hero-title">Coupon Codes</div>
                <div class="ab-hero-sub">Create discount codes users can apply at checkout</div>
            </div>
            <button class="ab-add-btn" onclick="openCouponModal()"><i class="fa-solid fa-plus"></i> <span>New</span></button>
        </div>

        <div class="ab-controls">
            <div class="ab-filter-pills" id="cpFilterPills">
                <button class="ab-pill active" onclick="setCouponFilter('all', this)">All</button>
                <button class="ab-pill" onclick="setCouponFilter('live', this)">Live</button>
                <button class="ab-pill" onclick="setCouponFilter('inactive', this)">Inactive</button>
                <button class="ab-pill" onclick="setCouponFilter('expired', this)">Expired</button>
            </div>
            <div class="ab-ctrl-right">
                <span class="ab-count-badge" id="cpCount">0 coupons</span>
                <button class="ab-icon-btn" onclick="loadCoupons()" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <div class="cp-list" id="cpList">
            <div class="ab-loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading coupons…</div>
        </div>
    </div>
</main>

<!-- ════ ADD / EDIT MODAL ════ -->
<div class="ab-modal-overlay" id="cpModalOverlay">
    <div class="ab-modal">
        <div class="ab-modal-header">
            <div class="ab-modal-title" id="cpModalTitle">New Coupon</div>
            <button class="ab-modal-close" onclick="closeCouponModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form class="ab-modal-body" id="cpForm" onsubmit="saveCoupon(event)">

            <div class="ab-form-group">
                <label class="ab-label">Coupon Name <span class="cp-req">*</span></label>
                <input type="text" class="ab-input" id="cpName" maxlength="60" required placeholder="e.g. Diwali Special">
            </div>

            <div class="ab-form-group">
                <label class="ab-label">Coupon Code (slug) <span class="cp-req">*</span></label>
                <input type="text" class="ab-input cp-upper" id="cpSlug" maxlength="20" required
                       pattern="[A-Za-z0-9_\-]{3,20}" placeholder="e.g. DIWALI20">
                <div class="cp-hint">3-20 letters, numbers, - or _. Users type this at checkout. Cannot be changed later.</div>
            </div>

            <div class="ab-form-group">
                <label class="ab-label">Description <span class="cp-opt">(shown to the user)</span></label>
                <input type="text" class="ab-input" id="cpDesc" maxlength="120" placeholder="e.g. 20% off on all orders above ₹200">
            </div>

            <div class="cp-row">
                <div class="ab-form-group">
                    <label class="ab-label">Discount Type <span class="cp-req">*</span></label>
                    <select class="ab-input" id="cpType" onchange="onTypeChange()">
                        <option value="percentage">Percentage (%)</option>
                        <option value="flat">Flat amount (₹)</option>
                    </select>
                </div>
                <div class="ab-form-group">
                    <label class="ab-label" id="cpValueLabel">Percent Off <span class="cp-req">*</span></label>
                    <input type="number" class="ab-input" id="cpValue" min="1" step="0.01" required placeholder="10">
                </div>
            </div>

            <div class="cp-row">
                <div class="ab-form-group" id="cpMaxWrap">
                    <label class="ab-label">Max Discount (₹) <span class="cp-opt">(optional cap)</span></label>
                    <input type="number" class="ab-input" id="cpMaxDiscount" min="0" step="1" placeholder="0 = no cap">
                </div>
                <div class="ab-form-group">
                    <label class="ab-label">Min Order (₹)</label>
                    <input type="number" class="ab-input" id="cpMinOrder" min="0" step="1" placeholder="0 = none">
                </div>
            </div>

            <div class="cp-row">
                <div class="ab-form-group">
                    <label class="ab-label">Valid From</label>
                    <input type="datetime-local" class="ab-input" id="cpFrom">
                </div>
                <div class="ab-form-group">
                    <label class="ab-label">Valid Till <span class="cp-req">*</span></label>
                    <input type="datetime-local" class="ab-input" id="cpTill" required>
                </div>
            </div>

            <div class="cp-row">
                <div class="ab-form-group">
                    <label class="ab-label">Uses Per User</label>
                    <input type="number" class="ab-input" id="cpPerUser" min="0" step="1" value="1" placeholder="0 = unlimited">
                </div>
                <div class="ab-form-group">
                    <label class="ab-label">Total Uses (all users)</label>
                    <input type="number" class="ab-input" id="cpTotalLimit" min="0" step="1" value="0" placeholder="0 = unlimited">
                </div>
            </div>

            <div class="ab-form-group">
                <label class="ab-label">Applies To</label>
                <select class="ab-input" id="cpApplies">
                    <option value="all">All orders</option>
                    <option value="product">Product orders only</option>
                    <option value="xerox">Xerox orders only</option>
                </select>
            </div>

            <div class="ab-form-group">
                <label class="ab-label">Restrict to Shops <span class="cp-opt">(none selected = all shops)</span></label>
                <div class="cp-shops" id="cpShops"><span class="cp-hint">Loading shops…</span></div>
            </div>

            <div class="ab-form-group">
                <label class="ab-checkbox-label">
                    <input type="checkbox" id="cpFirstOrder">
                    <span>First order only — valid only for users with no previous order</span>
                </label>
            </div>

            <div class="ab-form-group">
                <label class="ab-checkbox-label">
                    <input type="checkbox" id="cpActive" checked>
                    <span>Active — users can apply this coupon</span>
                </label>
            </div>

            <div class="ab-modal-footer">
                <button type="button" class="ab-btn-secondary" onclick="closeCouponModal()">Cancel</button>
                <button type="submit" class="ab-btn-primary" id="cpSaveBtn">Create Coupon</button>
            </div>
        </form>
    </div>
</div>

<!-- ════ USAGE MODAL ════ -->
<div class="ab-modal-overlay" id="cpUsageOverlay">
    <div class="ab-modal">
        <div class="ab-modal-header">
            <div class="ab-modal-title" id="cpUsageTitle">Usage</div>
            <button class="ab-modal-close" onclick="closeUsageModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="ab-modal-body" id="cpUsageBody"></div>
    </div>
</div>

<!-- ════ CONFIRM DIALOG ════ -->
<div class="ab-dialog-overlay" id="abDialogOverlay">
    <div class="ab-dialog">
        <div class="ab-dialog-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="ab-dialog-title" id="abDialogTitle">Are you sure?</div>
        <div class="ab-dialog-msg" id="abDialogMsg">This action cannot be undone.</div>
        <div class="ab-dialog-btns">
            <button class="ab-dialog-cancel" onclick="closeDialog(false)">Cancel</button>
            <button class="ab-dialog-confirm" id="abDialogConfirm">Confirm</button>
        </div>
    </div>
</div>

<div class="ab-toast" id="abToast"></div>

<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="admin-coupons.js?v=20260924c"></script>
</body>
</html>
