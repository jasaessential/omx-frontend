<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="seller-orders.css">
    <link rel="stylesheet" href="admin-orders.css">
    <link rel="stylesheet" href="admin-order-details.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

<!-- ════ SIDEBAR OVERLAY ════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav></aside>

<!-- ════ HEADER ════ -->
<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="so-back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="so-detail-header-info">
                <div class="so-detail-header-title" id="aodTitle">Order Details</div>
                <div class="so-detail-header-sub"   id="aodSub">Loading…</div>
            </div>
        </div>
        <div class="header-right" style="display:flex;align-items:center;gap:8px;">
            <a id="aodHeaderBillBtn" href="#" class="sod-header-bill-btn" title="Generate & Print Bill">
                <i class="fa-solid fa-file-invoice-dollar"></i> Bill
            </a>
            <!-- Delete order -->
            <button class="aod-header-del-btn" id="aodDeleteBtn"
                    onclick="deleteOrder()" title="Delete Order">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    </div>
</header>

<!-- ════ MAIN ════ -->
<main class="main-content sod-main">
    <div class="page-wrap so-wrap">

        <!-- Skeleton -->
        <div id="aodSkeleton">
            <div class="so-skeleton" style="height:32px;border-radius:50px;"></div>
            <div class="so-skeleton" style="height:260px;margin-top:10px;"></div>
            <div class="so-skeleton" style="height:160px;margin-top:10px;"></div>
            <div class="so-skeleton" style="height:160px;margin-top:10px;"></div>
        </div>

        <!-- Content -->
        <div id="aodContent" style="display:none;">

            <!-- Big order ID badge -->
            <div class="sod-order-id-badge" id="aodOrderIdBadge">ORDER #—</div>

            <!-- Top Action Row -->
            <div class="sod-top-actions-row">
                <a id="aodMainBillBtn" href="#" class="sod-btn-bill">
                    <i class="fa-solid fa-file-invoice-dollar"></i> Generate &amp; Print Bill
                </a>
            </div>

            <!-- Summary card -->
            <div class="sod-section" id="aodSummaryCard"></div>

            <!-- Items -->
            <div id="aodItemsList"></div>

        </div>

        <!-- Error -->
        <div class="so-empty" id="aodError" style="display:none;">
            <i class="fa-solid fa-triangle-exclamation so-empty-icon" style="color:#f59e0b;"></i>
            <h3>Order Not Found</h3>
            <p>This order may have been removed or you don't have access.</p>
            <button onclick="history.back()" class="so-back-link-btn">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>
        </div>

    </div>
</main>

<!-- ════ ITEM STATUS SHEET ════ -->
<div class="so-sheet-overlay" id="aodRejectOverlay" onclick="closeRejectSheet()"></div>
<div class="so-sheet"         id="aodRejectSheet">
    <div class="so-sheet-header">
        <div>
            <div class="so-sheet-title">Reject Item</div>
            <div class="so-sheet-sub" id="aodRejectItemName">—</div>
        </div>
        <button class="so-sheet-close" onclick="closeRejectSheet()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div class="so-sheet-body">
        <textarea id="aodRejectReason"
            placeholder="Enter rejection reason (optional)…"
            style="width:100%;min-height:120px;padding:12px;
                   border:1.5px solid var(--border2);border-radius:var(--r-sm);
                   font-family:inherit;font-size:.84rem;resize:vertical;
                   background:var(--bg-white);color:var(--txt1);outline:none;"></textarea>
    </div>
    <div class="so-sheet-footer">
        <button class="so-btn-ghost so-btn-flex" onclick="closeRejectSheet()">Cancel</button>
        <button class="so-btn-primary so-btn-flex" onclick="confirmReject()"
                style="background:#ef4444;">
            <i class="fa-solid fa-ban"></i> Reject Item
        </button>
    </div>
</div>

<!-- ════ BOTTOM NAV ════ -->
<nav class="ao-bottom-nav">
    <a href="index.html"        class="ao-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="admin-orders.html" class="ao-nav-item active"><i class="fa-solid fa-clipboard-list"></i><span>Orders</span></a>
    <a href="manage-users.html" class="ao-nav-item"><i class="fa-solid fa-users-gear"></i><span>Users</span></a>
    <a href="profile.html"      class="ao-nav-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
</nav>

<!-- ════ TOAST ════ -->
<div class="so-toast" id="soToast"></div>

<!-- ════ SCRIPTS ════ -->
<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="admin-order-details.js?v=20261001a"></script>
</body>
</html>
