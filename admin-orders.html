<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders — JASA V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-orders.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

<!-- ════ SIDEBAR OVERLAY ════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav></aside>

<!-- ════ HEADER ════ -->
<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
            <span class="ao-page-title"><i class="fa-solid fa-clipboard-list"></i> Admin Orders</span>
        </div>
        <div class="header-right">
            <!-- Download CSV -->
            <button class="ao-header-btn" id="aoDownloadBtn" onclick="downloadCSV()" title="Download Report">
                <i class="fa-solid fa-download"></i>
            </button>
            <!-- Cleanup mode toggle -->
            <button class="ao-header-btn ao-cleanup-toggle" id="aoCleanupToggle" onclick="toggleCleanupMode()" title="Cleanup Mode">
                <i class="fa-solid fa-broom"></i>
            </button>
        </div>
    </div>
</header>

<!-- ════ STATUS FILTER BAR ════ -->
<div class="ao-filter-bar" id="aoFilterBar">
    <div class="ao-filter-inner">
        <button class="ao-filter-tab active" data-filter="all"              onclick="setFilter('all',this)">All</button>
        <button class="ao-filter-tab"        data-filter="pending"          onclick="setFilter('pending',this)">Pending</button>
        <button class="ao-filter-tab"        data-filter="confirmed"        onclick="setFilter('confirmed',this)">Confirmed</button>
        <button class="ao-filter-tab"        data-filter="processing"       onclick="setFilter('processing',this)">Processing</button>
        <button class="ao-filter-tab"        data-filter="out for delivery" onclick="setFilter('out for delivery',this)">Out for Delivery</button>
        <button class="ao-filter-tab"        data-filter="delivered"        onclick="setFilter('delivered',this)">Delivered</button>
        <button class="ao-filter-tab"        data-filter="cancelled"        onclick="setFilter('cancelled',this)">Cancelled</button>
        <button class="ao-filter-tab"        data-filter="rejected"         onclick="setFilter('rejected',this)">Rejected</button>
    </div>
</div>

<!-- ════ MAIN ════ -->
<main class="main-content">
    <div class="page-wrap ao-wrap">

        <!-- ── Stats ── -->
        <div class="ao-stats-grid">
            <div class="ao-stat-card ao-stat-card--blue">
                <div class="ao-stat-icon"><i class="fa-solid fa-clipboard-list"></i></div>
                <div class="ao-stat-body">
                    <div class="ao-stat-value" id="aoStatTotal">—</div>
                    <div class="ao-stat-label">Total</div>
                </div>
            </div>
            <div class="ao-stat-card ao-stat-card--amber">
                <div class="ao-stat-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                <div class="ao-stat-body">
                    <div class="ao-stat-value" id="aoStatPending">—</div>
                    <div class="ao-stat-label">Pending</div>
                </div>
            </div>
            <div class="ao-stat-card ao-stat-card--cyan">
                <div class="ao-stat-icon"><i class="fa-solid fa-gears"></i></div>
                <div class="ao-stat-body">
                    <div class="ao-stat-value" id="aoStatActive">—</div>
                    <div class="ao-stat-label">Active</div>
                </div>
            </div>
            <div class="ao-stat-card ao-stat-card--green">
                <div class="ao-stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="ao-stat-body">
                    <div class="ao-stat-value" id="aoStatDelivered">—</div>
                    <div class="ao-stat-label">Delivered</div>
                </div>
            </div>
            <div class="ao-stat-card ao-stat-card--violet">
                <div class="ao-stat-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                <div class="ao-stat-body">
                    <div class="ao-stat-value" id="aoStatRevenue">—</div>
                    <div class="ao-stat-label">Revenue</div>
                </div>
            </div>
        </div>

        <!-- ── Cleanup banner (hidden by default) ── -->
        <div class="ao-cleanup-banner" id="aoCleanupBanner" style="display:none;">
            <div class="ao-cleanup-banner-left">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div>
                    <div class="ao-cleanup-banner-title">Cleanup Mode</div>
                    <div class="ao-cleanup-banner-sub">Select orders to delete permanently. Cannot be undone.</div>
                </div>
            </div>
            <button class="ao-select-all-btn" id="aoSelectAllBtn" onclick="toggleSelectAll()">
                <i class="fa-solid fa-check-double"></i> Select All
            </button>
        </div>

        <!-- ── Search + Filters row ── -->
        <div class="ao-search-row">
            <div class="ao-search-wrap">
                <i class="fa-solid fa-magnifying-glass ao-search-icon"></i>
                <input type="search" id="aoSearch" class="ao-search-input"
                       placeholder="Search ID, name, phone, shop…"
                       autocomplete="off" oninput="onSearchInput(this.value)">
            </div>
            <div class="ao-type-toggle">
                <button class="ao-type-btn active" data-type="all"     onclick="setTypeFilter('all',this)">All</button>
                <button class="ao-type-btn"        data-type="xerox"   onclick="setTypeFilter('xerox',this)">Xerox</button>
                <button class="ao-type-btn"        data-type="product" onclick="setTypeFilter('product',this)">Products</button>
            </div>
        </div>

        <!-- ── Extra filters (shop, payment, date) ── -->
        <div class="ao-extra-filters" id="aoExtraFilters">

            <!-- Shop filter -->
            <div class="ao-filter-group">
                <div class="ao-filter-group-label">Shop</div>
                <div class="ao-pill-row" id="aoShopPills">
                    <button class="ao-pill active" data-value="all" onclick="setShopFilter('all',this)">All Shops</button>
                    <!-- populated by JS -->
                </div>
            </div>

            <!-- Payment filter -->
            <div class="ao-filter-group">
                <div class="ao-filter-group-label">Payment</div>
                <div class="ao-pill-row">
                    <button class="ao-pill active" data-value="all" onclick="setPaymentFilter('all',this)">All</button>
                    <button class="ao-pill" data-value="cod"     onclick="setPaymentFilter('cod',this)">COD</button>
                    <button class="ao-pill" data-value="prepaid" onclick="setPaymentFilter('prepaid',this)">Prepaid</button>
                </div>
            </div>

            <!-- Date range -->
            <div class="ao-filter-group">
                <div class="ao-filter-group-label">Date Range</div>
                <div class="ao-date-row">
                    <input type="date" class="ao-date-input" id="aoDateFrom" onchange="onDateChange()">
                    <span class="ao-date-sep">—</span>
                    <input type="date" class="ao-date-input" id="aoDateTo"   onchange="onDateChange()">
                </div>
            </div>

        </div>

        <!-- ── Skeleton loaders ── -->
        <div id="aoSkeletons" class="ao-skeletons">
            <div class="ao-skeleton"></div>
            <div class="ao-skeleton"></div>
            <div class="ao-skeleton"></div>
        </div>

        <!-- ── Empty state ── -->
        <div id="aoEmpty" class="ao-empty" style="display:none;">
            <i class="fa-solid fa-inbox ao-empty-icon"></i>
            <h3>No orders found</h3>
            <p>Try adjusting your filters or search query.</p>
        </div>

        <!-- ── Orders list ── -->
        <div id="aoList"></div>

    </div><!-- /ao-wrap -->
</main>

<!-- ════ BULK DELETE BAR (cleanup mode) ════ -->
<div class="ao-bulk-bar" id="aoBulkBar" style="display:none;">
    <button class="ao-bulk-del-btn" id="aoBulkDelBtn" onclick="bulkDeleteOrders()">
        <i class="fa-solid fa-trash-can"></i>
        Delete <span id="aoBulkCount">0</span> orders permanently
    </button>
</div>

<!-- ════ BOTTOM NAV ════ -->
<nav class="ao-bottom-nav">
    <a href="index.html"        class="ao-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="admin-orders.html" class="ao-nav-item active"><i class="fa-solid fa-clipboard-list"></i><span>Orders</span></a>
    <a href="manage-users.html" class="ao-nav-item"><i class="fa-solid fa-users-gear"></i><span>Users</span></a>
    <a href="profile.html"      class="ao-nav-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
</nav>

<!-- ════ TOAST ════ -->
<div class="ao-toast" id="aoToast"></div>

<!-- ════ SCRIPTS ════ -->
<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="admin-orders.js"></script>
</body>
</html>
