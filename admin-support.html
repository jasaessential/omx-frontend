<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Queries — JASA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-cache.css">
    <link rel="stylesheet" href="admin-requests.css">
</head>
<body>

<!-- ════ SIDEBAR ════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav></aside>

<!-- ════ HEADER ════ -->
<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
            <span class="ac-page-title">
                <i class="fa-solid fa-headset" style="color:#16a34a;"></i> Support Queries
            </span>
        </div>
        <div class="header-right">
            <button class="ac-refresh-btn" id="refreshBtn" onclick="loadQueries()" title="Refresh">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <a href="index.html" class="header-icon-btn" title="Home">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </div>
</header>

<!-- ════ MAIN ════ -->
<main class="main-content">
<div class="page-wrap ac-wrap">

    <!-- Stats -->
    <div class="ac-stats-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="ac-stat ac-stat--blue">
            <i class="fa-solid fa-inbox"></i>
            <div class="ac-stat-val" id="statTotal">—</div>
            <div class="ac-stat-lbl">Total</div>
        </div>
        <div class="ac-stat ac-stat--amber">
            <i class="fa-solid fa-clock"></i>
            <div class="ac-stat-val" id="statOpen">—</div>
            <div class="ac-stat-lbl">Open</div>
        </div>
        <div class="ac-stat ac-stat--green">
            <i class="fa-solid fa-circle-check"></i>
            <div class="ac-stat-val" id="statClosed">—</div>
            <div class="ac-stat-lbl">Closed</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="ar-filter-row">
        <select id="filterStatus" class="ar-select" onchange="renderQueries()">
            <option value="all">All Status</option>
            <option value="open">Open</option>
            <option value="replied">Replied</option>
            <option value="closed">Closed</option>
        </select>
        <select id="filterType" class="ar-select" onchange="renderQueries()">
            <option value="all">All Types</option>
            <option value="general">General</option>
            <option value="order">Order</option>
            <option value="product">Product</option>
            <option value="delivery">Delivery</option>
            <option value="payment">Payment</option>
            <option value="technical">Technical</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
        </select>
    </div>

    <!-- Query list -->
    <div id="queriesList">
        <div class="ac-table-card">
            <div class="ac-table-empty">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading…
            </div>
        </div>
    </div>

</div>
</main>

<!-- ════ BOTTOM NAV ════ -->
<nav class="ac-bottom-nav">
    <a href="index.html"                  class="ac-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="admin-orders.html"           class="ac-nav-item"><i class="fa-solid fa-clipboard-list"></i><span>Orders</span></a>
    <a href="admin-product-requests.html" class="ac-nav-item"><i class="fa-solid fa-box-open"></i><span>Requests</span></a>
    <a href="admin-support.html"          class="ac-nav-item active"><i class="fa-solid fa-headset"></i><span>Support</span></a>
    <a href="profile.html"                class="ac-nav-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
</nav>

<!-- ════ REPLY SHEET ════ -->
<div class="so-sheet-overlay" id="replyOverlay" onclick="closeReplySheet()"></div>
<div class="so-sheet" id="replySheet">
    <div class="so-sheet-header">
        <div>
            <div class="so-sheet-title">Reply to Query</div>
            <div class="so-sheet-sub" id="replySheetSub">—</div>
        </div>
        <button class="so-sheet-close" onclick="closeReplySheet()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div class="so-sheet-body">
        <textarea id="replyText" class="ar-reply-textarea"
            placeholder="Enter your reply…"></textarea>
    </div>
    <div class="so-sheet-footer">
        <button class="so-btn-ghost so-btn-flex" onclick="closeReplySheet()">Cancel</button>
        <button class="so-btn-primary so-btn-flex" onclick="submitReply()">
            <i class="fa-solid fa-reply"></i> Send Reply
        </button>
    </div>
</div>

<!-- ════ DELETE CONFIRM DIALOG ════ -->
<div class="ac-dialog-overlay" id="delDialog">
    <div class="ac-dialog">
        <div class="ac-dialog-icon danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div class="ac-dialog-title" id="dialogTitle">Delete Query?</div>
        <div class="ac-dialog-msg"   id="dialogMsg">This cannot be undone.</div>
        <div class="ac-dialog-btns">
            <button class="ac-dialog-cancel"  onclick="closeDelDialog()">Cancel</button>
            <button class="ac-dialog-confirm" id="dialogConfirmBtn">Delete</button>
        </div>
    </div>
</div>

<div class="ac-toast" id="acToast"></div>

<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="admin-support.js"></script>
</body>
</html>
