<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="categories.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

    <!-- ════════ SIDEBAR OVERLAY ════════ -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ════════ SIDEBAR ════════ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fa-solid fa-print" style="color:var(--primary);"></i>
                <a href="index.html" class="header-brand">
                    <span class="brand-print">Order</span>
                    <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                    <span class="brand-xerox">xerox</span>
                </a>
            </div>
            <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="sbIdentity"></div>
        <nav class="sidebar-nav" id="sbNav"></nav></aside>

    <!-- ════════ HEADER ════════ -->
    <header class="header" id="mainHeader">
        <div class="header-inner">
            <div class="header-left">
                <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
                <a href="index.html" class="header-brand">
                    <span class="brand-print">Order</span>
                    <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                    <span class="brand-xerox">xerox</span>
                </a>
            </div>
            <div class="header-right">
                <a href="cart.html" class="header-cart-btn" id="headerCartBtn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="header-cart-badge" id="headerCartBadge" style="display:none;"></span>
                </a>
                <a href="login.html"   class="header-login-btn" id="headerLoginBtn">
                    <i class="fa-regular fa-user"></i><span>Login</span>
                </a>
                <a href="profile.html" class="header-avatar-wrap" id="headerAvatarWrap"
                   style="display:none;" title="My Account">
                    <i class="fa-solid fa-user header-avatar-icon" id="headerAvatarIcon"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- ════════ CATEGORY SWITCH BAR (fixed below header) ════════ -->
    <div class="cat-bar" id="catBar">
        <div class="cat-bar-inner">
            <button class="cat-tab" data-cat="stationary" onclick="switchCategory('stationary')">
                <i class="fa-solid fa-pen-ruler"></i> Stationary
            </button>
            <button class="cat-tab" data-cat="books" onclick="switchCategory('books')">
                <i class="fa-solid fa-book-open"></i> Books
            </button>
            <button class="cat-tab" data-cat="electronic" onclick="switchCategory('electronic')">
                <i class="fa-solid fa-microchip"></i> Kits
            </button>
            <button class="cat-tab" data-cat="posters" onclick="switchCategory('posters')">
                <i class="fa-solid fa-image"></i> Posters
            </button>
        </div>
    </div>

    <!-- ════════ MAIN ════════ -->
    <main class="main-content cat-main">
    <div class="page-wrap">

        <!-- ── TOOLBAR: search + filter + sort ── -->
        <div class="cat-toolbar">
            <!-- Search -->
            <div class="cat-search-wrap">
                <i class="fa-solid fa-magnifying-glass cat-search-icon"></i>
                <input  type="text" id="searchInput" class="cat-search-input"
                        placeholder="Search products…" autocomplete="off">
                <button id="searchClearBtn" class="cat-search-clear" style="display:none;"
                        onclick="clearSearch()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Filter button -->
            <button class="cat-tool-btn" id="filterBtn" onclick="openFilterSheet()">
                <i class="fa-solid fa-sliders"></i>
                <span>Filter</span>
                <span class="cat-badge" id="filterBadge" style="display:none;">0</span>
            </button>
            <!-- Sort button -->
            <button class="cat-tool-btn" id="sortBtn" onclick="openSortSheet()">
                <i class="fa-solid fa-arrow-up-wide-short"></i>
                <span>Sort</span>
            </button>
        </div>

        <!-- ── CUSTOMIZE POSTER (Wall Posters only) ── -->
        <a href="custom-poster.html" class="cat-custom-card" id="customPosterCard" style="display:none;">
            <span class="cat-custom-ico"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
            <span class="cat-custom-txt">
                <b>Customize your poster</b>
                <small>Pick a size, upload your picture and fit it your way</small>
            </span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>

        <!-- ── ACTIVE FILTER CHIPS ── -->
        <div class="cat-chips" id="activeChips" style="display:none;"></div>

        <!-- ── RESULTS COUNT ── -->
        <div class="cat-results-row">
            <span class="cat-results-count" id="resultsCount"></span>
        </div>

        <!-- ── PRODUCT GRID ── -->
        <div class="cat-grid" id="productsGrid">
            <!-- skeleton on first load -->
            <div class="cat-skeleton"></div>
            <div class="cat-skeleton"></div>
            <div class="cat-skeleton"></div>
            <div class="cat-skeleton"></div>
            <div class="cat-skeleton"></div>
            <div class="cat-skeleton"></div>
        </div>

    </div>
    </main>

    <!-- ════════ BOTTOM NAV ════════ -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
        <a href="categories.html"  class="bottom-nav-item active"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
        <a href="orders.html"      class="bottom-nav-item"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
        <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
    </nav>

    <!-- ════════ FILTER BOTTOM SHEET ════════ -->
    <div class="sheet-backdrop" id="filterBackdrop" onclick="closeFilterSheet()"></div>
    <div class="bottom-sheet" id="filterSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
            <span class="sheet-title">Filter</span>
            <button class="sheet-clear" onclick="clearAllFilters()">Clear All</button>
        </div>
        <div class="sheet-body">
            <!-- filter tab row -->
            <div class="filter-tab-row" id="filterCats"></div>
            <!-- option panes -->
            <div class="filter-panes" id="filterOpts"></div>
        </div>
        <div class="sheet-foot">
            <button class="sheet-apply-btn" onclick="applyFilters()">
                Apply <span id="filterApplyCount"></span>
            </button>
        </div>
    </div>

    <!-- ════════ SORT BOTTOM SHEET ════════ -->
    <div class="sheet-backdrop" id="sortBackdrop" onclick="closeSortSheet()"></div>
    <div class="bottom-sheet" id="sortSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
            <span class="sheet-title">Sort By</span>
        </div>
        <div class="sheet-body">
            <div id="sortOptionsList"></div>
        </div>
    </div>

    <!-- ════════ TOAST ════════ -->
    <div class="cat-toast" id="catToast"></div>
    <script src="app.js"></script>
    <script type="module" src="auth-header.js"></script>
    <script type="module" src="categories.js?v=20261009a"></script>
</body>
</html>
