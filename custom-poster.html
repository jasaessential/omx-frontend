<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Poster — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="item-details.css?v=20261008a">
    <link rel="stylesheet" href="custom-poster.css?v=1">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

    <header class="id-header">
        <button class="id-back-btn" onclick="history.length > 1 ? history.back() : window.location.href='categories.html?cat=posters'" title="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 class="id-header-title">Customize Poster</h1>
        <a href="cart.html" class="id-cart-btn" title="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="id-cart-badge" id="cartBadge" style="display:none;">0</span>
        </a>
    </header>

    <main class="id-main cp-main">

        <div class="id-section cp-msg" id="cpLoading">Loading sizes…</div>
        <div class="id-section cp-msg" id="cpUnavailable" style="display:none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            Custom posters are not available right now. Please check back soon.
        </div>

        <div id="cpBody" style="display:none;">

            <!-- 1. SIZE -->
            <div class="id-section">
                <div class="id-section-title">1. Choose size</div>
                <div class="cp-sizes" id="cpSizes"></div>
                <div class="cp-orient" id="cpOrient">
                    <button type="button" data-o="portrait" class="active"><i class="fa-regular fa-file"></i> Portrait</button>
                    <button type="button" data-o="landscape"><i class="fa-regular fa-image"></i> Landscape</button>
                </div>
            </div>

            <!-- 2. PAPER -->
            <div class="id-section" id="cpGsmSection">
                <div class="id-section-title">2. Paper (GSM)</div>
                <div class="id-tags" id="cpGsm"></div>
                <div class="cp-hint">Higher GSM = thicker, sturdier paper.</div>
            </div>

            <!-- 3. PICTURE + EDITOR -->
            <div class="id-section">
                <div class="id-section-title">3. Upload &amp; fit your picture</div>

                <label class="id-upload cp-upload" for="cpFile" id="cpUploadBox">
                    <span class="id-upload-hint">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        Tap to choose a picture
                    </span>
                </label>
                <input type="file" id="cpFile" accept="image/*" hidden>

                <div id="cpEditor" style="display:none;">
                    <div class="cp-stage">
                        <canvas id="cpCanvas"></canvas>
                    </div>
                    <div class="cp-hint cp-center">Drag to move · pinch or use the slider to zoom</div>

                    <div class="cp-ctl">
                        <button type="button" class="cp-btn" id="cpRotL" title="Rotate left"><i class="fa-solid fa-rotate-left"></i></button>
                        <button type="button" class="cp-btn" id="cpRotR" title="Rotate right"><i class="fa-solid fa-rotate-right"></i></button>
                        <button type="button" class="cp-btn cp-btn-text" id="cpReset"><i class="fa-solid fa-expand"></i> Fit</button>
                        <label class="cp-btn cp-btn-text" for="cpFile"><i class="fa-regular fa-image"></i> Change</label>
                    </div>

                    <div class="cp-slider">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                        <input type="range" id="cpZoom" min="0.2" max="5" step="0.01" value="1" aria-label="Zoom">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </div>
                    <div class="cp-slider">
                        <i class="fa-solid fa-rotate"></i>
                        <input type="range" id="cpAngle" min="-45" max="45" step="0.5" value="0" aria-label="Fine rotation">
                        <span class="cp-val" id="cpAngleVal">0°</span>
                    </div>
                </div>

                <div class="id-upload-status" id="cpStatus"></div>
                <textarea class="id-note" id="cpNote" maxlength="300" rows="2"
                          placeholder="Note for the shop (optional)"></textarea>
            </div>

            <!-- PRICE + ACTIONS -->
            <div class="id-section id-info-section">
                <div class="cp-summary" id="cpSummary"></div>
                <div class="id-price-row">
                    <span class="id-price"      id="cpPrice"></span>
                    <span class="id-price-orig" id="cpPriceOrig" style="display:none;"></span>
                    <span class="id-price-disc" id="cpPriceDisc" style="display:none;"></span>
                </div>
            </div>

            <div class="id-section id-actions">
                <button class="id-btn-cart" id="cpAddCart"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                <button class="id-btn-buy"  id="cpBuyNow"><i class="fa-solid fa-bag-shopping"></i> Buy Now</button>
            </div>
        </div>

        <div style="height:24px;"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
        <a href="categories.html"  class="bottom-nav-item active"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
        <a href="orders.html"      class="bottom-nav-item"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
        <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
    </nav>

    <div class="id-toast" id="idToast"></div>

    <script src="app.js"></script>
    <script type="module" src="custom-poster.js?v=1"></script>
</body>
</html>
