<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Order Details — JASA V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="seller-orders.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

<!-- ════ SIDEBAR OVERLAY ════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav></aside>

<!-- ════ HEADER ════ -->
<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="so-back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="so-detail-header-info">
                <div class="so-detail-header-title" id="eodTitle">Order Details</div>
                <div class="so-detail-header-sub"   id="eodSub">Loading…</div>
            </div>
        </div>
        <div class="header-right">
            <!-- WA quick-send button (populated by JS) -->
            <div id="eodWaBtn"></div>
        </div>
    </div>
</header>

<!-- ════ MAIN ════ -->
<main class="main-content sod-main">
    <div class="page-wrap so-wrap">

        <!-- Skeleton -->
        <div id="eodSkeleton">
            <div class="so-skeleton" style="height:32px;border-radius:50px;"></div>
            <div class="so-skeleton" style="height:260px;margin-top:10px;"></div>
            <div class="so-skeleton" style="height:160px;margin-top:10px;"></div>
            <div class="so-skeleton" style="height:160px;margin-top:10px;"></div>
        </div>

        <!-- Content -->
        <div id="eodContent" style="display:none;">
            <!-- Big order ID badge -->
            <div class="sod-order-id-badge" id="eodOrderIdBadge">ORDER #—</div>

            <!-- Summary section -->
            <div class="sod-section" id="eodSummaryCard"></div>

            <!-- Items -->
            <div id="eodItemsList"></div>

            <!-- Bulk deliver action card (shown only for active deliveries) -->
            <div id="eodBulkDeliverCard" style="display:none;">
                <div class="sod-section" style="overflow:visible;">
                    <div class="sod-section-title">
                        <i class="fa-solid fa-truck-fast"></i> Mark as Delivered
                    </div>
                    <div style="padding:12px 14px;">
                        <p style="font-size:.78rem;font-weight:600;color:var(--txt2);margin-bottom:10px;">
                            Use the buttons on each item above, or mark all deliverable items at once:
                        </p>
                        <button class="so-details-btn" onclick="eodMarkAllDelivered()" style="margin-top:0;">
                            <i class="fa-solid fa-circle-check"></i> Mark All Confirmed Items as Delivered
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error -->
        <div class="so-empty" id="eodError" style="display:none;">
            <i class="fa-solid fa-triangle-exclamation so-empty-icon" style="color:#f59e0b;"></i>
            <h3>Order Not Found</h3>
            <p>This order may have been removed or you don't have access.</p>
            <button onclick="history.back()" class="so-back-link-btn">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>
        </div>

    </div>
</main>

<!-- ════ BOTTOM NAV ════ -->
<nav class="so-bottom-nav">
    <a href="index.html"           class="so-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="employee-orders.html" class="so-nav-item active"><i class="fa-solid fa-motorcycle"></i><span>Delivery</span></a>
    <a href="profile.html"         class="so-nav-item"><i class="fa-solid fa-user-gear"></i><span>Profile</span></a>
</nav>

<!-- ════ TOAST ════ -->
<div class="so-toast" id="soToast"></div>

<!-- ════ SCRIPTS ════ -->
<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="employee-order-details.js?v=20261001a"></script>
</body>
</html>
