<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="orders.css">

    <!-- PDF.js for late-upload page count validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

    <!-- ════ HEADER ════ -->
    <header class="od-header">
        <button class="od-back-btn" onclick="history.length>1?history.back():window.location.href='orders.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="od-header-info">
            <h1 class="od-header-title">Order Details</h1>
            <p  class="od-header-sub"  id="odHeaderSub">Loading…</p>
        </div>
    </header>

    <!-- ════ SKELETON ════ -->
    <div class="od-skeleton" id="odSkeleton">
        <div class="od-skel od-skel-summary"></div>
        <div class="od-skel od-skel-item"></div>
        <div class="od-skel od-skel-item"></div>
    </div>

    <!-- ════ CONTENT ════ -->
    <main class="od-main" id="odContent" style="display:none;">
        <div style="height:12px;"></div>

        <!-- Summary KV card -->
        <div class="od-section" id="odSummaryCard"></div>

        <!-- Items -->
        <div id="odItemsList"></div>

        <!-- Error -->
        <div id="odError" style="display:none;text-align:center;padding:48px 20px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size:3rem;color:#ef4444;margin-bottom:14px;"></i>
            <h3 style="font-size:1rem;font-weight:800;color:var(--txt1);margin-bottom:6px;">Order not found</h3>
            <p style="font-size:.8rem;font-weight:600;color:var(--txt3);margin-bottom:18px;">This order may have been removed or you don't have access.</p>
            <a href="orders.html" style="display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:var(--primary);color:#fff;border-radius:50px;font-size:.82rem;font-weight:800;text-decoration:none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Orders
            </a>
        </div>

        <div style="height:24px;"></div>
    </main>

    <!-- ════ BOTTOM NAV ════ -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
        <a href="categories.html"  class="bottom-nav-item"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
        <a href="orders.html"      class="bottom-nav-item active"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
        <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
    </nav>

    <!-- ════ TOAST CONTAINER ════ -->
    <div id="odToastContainer" style="
        position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
        display:flex; flex-direction:column; align-items:center; gap:8px;
        z-index:9999; pointer-events:none; width:min(92vw,360px);
    "></div>

    <!-- ════ CONFIRM DIALOG ════ -->
    <div id="odConfirmBackdrop" style="
        display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
        z-index:10000; align-items:flex-end; justify-content:center;
        backdrop-filter:blur(2px);
    ">
        <div id="odConfirmSheet" style="
            background:var(--card-bg,#fff); border-radius:20px 20px 0 0;
            padding:24px 20px 32px; width:100%; max-width:480px;
            transform:translateY(100%); transition:transform 0.3s cubic-bezier(.4,0,.2,1);
            box-shadow:0 -4px 32px rgba(0,0,0,0.15);
        ">
            <div id="odConfirmIcon" style="text-align:center;margin-bottom:12px;"></div>
            <h3 id="odConfirmTitle" style="text-align:center;font-size:1rem;font-weight:800;color:var(--txt1,#1a1d23);margin:0 0 8px;"></h3>
            <p  id="odConfirmMsg"   style="text-align:center;font-size:0.82rem;font-weight:500;color:var(--txt3,#6b7280);margin:0 0 22px;line-height:1.5;"></p>
            <div style="display:flex;gap:10px;">
                <button id="odConfirmCancel" style="
                    flex:1;padding:12px;border-radius:50px;border:1.5px solid var(--border,#e5e7eb);
                    background:transparent;font-size:0.85rem;font-weight:700;
                    color:var(--txt2,#374151);cursor:pointer;
                ">Keep Item</button>
                <button id="odConfirmOk" style="
                    flex:1;padding:12px;border-radius:50px;border:none;
                    background:#ef4444;color:#fff;font-size:0.85rem;font-weight:800;
                    cursor:pointer;
                ">Yes, Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script type="module" src="order-details.js?v=20261001a"></script>
</body>
</html>
