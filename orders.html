<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="orders.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

    <!-- ════ SIDEBAR OVERLAY ════ -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ════ SIDEBAR ════ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fa-solid fa-print" style="color:var(--primary);"></i>
                <a href="index.html" class="header-brand">
                    <span class="brand-print">Order</span>
                    <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                    <span class="brand-xerox">xerox</span>
                </a>
            </div>
            <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- Identity area: guest card or logged-in hero — injected by app.js -->
        <div id="sbIdentity"></div>
        <!-- Nav groups: access-boxes — injected by app.js -->
        <nav class="sidebar-nav" id="sbNav"></nav>
    </aside>

    <!-- ════ HEADER ════ -->
    <header class="header" id="mainHeader">
        <div class="header-inner">
            <div class="header-left">
                <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
                <a href="index.html" class="header-brand">
                    <span class="brand-print">Order</span><span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span><span class="brand-xerox">xerox</span>
                </a>
            </div>
            <div class="header-right">
                <a href="cart.html" class="header-cart-btn" id="headerCartBtn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="header-cart-badge" id="headerCartBadge" style="display:none;"></span>
                </a>
                <a href="login.html"   class="header-login-btn" id="headerLoginBtn"><i class="fa-regular fa-user"></i><span>Login</span></a>
                <a href="profile.html" class="header-avatar-wrap" id="headerAvatarWrap" style="display:none;" title="My Account">
                    <i class="fa-solid fa-user header-avatar-icon" id="headerAvatarIcon"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- ════ FILTER BAR (fixed below header) ════ -->
    <div class="ord-filter-bar" id="filterBar">
        <div class="ord-filter-inner">
            <button class="ord-filter-tab" data-filter="active"    onclick="setFilter('active',this)">Active</button>
            <button class="ord-filter-tab" data-filter="all"       onclick="setFilter('all',this)">All</button>
            <button class="ord-filter-tab" data-filter="delivered" onclick="setFilter('delivered',this)">Delivered</button>
            <button class="ord-filter-tab" data-filter="rejected"  onclick="setFilter('rejected',this)">Rejected</button>
        </div>
    </div>

    <!-- ════ MAIN ════ -->
    <main class="main-content ord-main">
    <div class="page-wrap">

        <div class="ord-page-head">
            <div class="ord-page-icon"><i class="fa-solid fa-box"></i></div>
            <div>
                <h1 class="ord-page-title">My Orders</h1>
                <p  class="ord-page-sub">Track and manage your purchases</p>
            </div>
        </div>

        <!-- Skeleton -->
        <div id="ordSkeleton">
            <div class="ord-skeleton"></div>
            <div class="ord-skeleton"></div>
            <div class="ord-skeleton"></div>
        </div>

        <!-- Empty state -->
        <div class="ord-empty" id="ordEmpty" style="display:none;">
            <i class="fa-solid fa-box-open ord-empty-icon"></i>
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Browse our shop!</p>
            <a href="categories.html" class="ord-empty-btn"><i class="fa-solid fa-store"></i> Browse Shop</a>
        </div>

        <!-- Orders list -->
        <div id="ordList"></div>

        <div style="height:16px;"></div>
    </div>
    </main>

    <!-- ════ BOTTOM NAV ════ -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
        <a href="categories.html"  class="bottom-nav-item"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
        <a href="orders.html"      class="bottom-nav-item active"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
        <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
    </nav>
    <script src="app.js"></script>
    <script type="module" src="auth-header.js"></script>
    <script type="module" src="orders.js"></script>
</body>
</html>
