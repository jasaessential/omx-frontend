<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Product — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
    <style>
        /* ── Wrap ── */
        .pr-wrap {
            padding: 16px 0 calc(var(--bnh,64px) + 24px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── Hero banner ── */
        .pr-hero {
            border-radius: var(--r);
            background: linear-gradient(135deg,#1a55d4 0%,var(--primary) 60%,#38a9ff 100%);
            padding: 20px 18px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .pr-hero::after {
            content:'';
            position:absolute;right:-30px;top:-30px;
            width:140px;height:140px;
            border-radius:50%;
            background:rgba(255,255,255,.07);
        }
        .pr-hero-icon {
            width:50px;height:50px;
            background:rgba(255,255,255,.2);
            border-radius:14px;
            display:flex;align-items:center;justify-content:center;
            font-size:1.4rem;flex-shrink:0;
            backdrop-filter:blur(4px);
        }
        .pr-hero-title  { font-size:.95rem;font-weight:800;margin-bottom:3px; }
        .pr-hero-sub    { font-size:.72rem;font-weight:500;opacity:.88;line-height:1.45; }

        /* ── Card ── */
        .pr-card {
            background:var(--bg-white);
            border:1px solid var(--border);
            border-radius:var(--r);
            padding:18px;
            box-shadow:var(--sh-sm);
        }
        .pr-card-title {
            font-size:.84rem;font-weight:800;color:var(--txt1);
            margin-bottom:16px;
            display:flex;align-items:center;gap:8px;
        }
        .pr-card-title i { color:var(--primary); }

        /* ── Fields ── */
        .pr-field { margin-bottom:14px; }
        .pr-label {
            display:block;
            font-size:.66rem;font-weight:800;
            color:var(--txt3);
            text-transform:uppercase;letter-spacing:.6px;
            margin-bottom:6px;
        }
        .pr-label .req { color:#ef4444;margin-left:2px; }

        .pr-input,.pr-select,.pr-textarea {
            width:100%;padding:11px 14px;
            border:1.5px solid var(--border2);
            border-radius:var(--r-sm);
            background:var(--bg-white);color:var(--txt1);
            font-family:inherit;font-size:.84rem;font-weight:500;
            transition:border-color var(--ease),box-shadow var(--ease);
            outline:none;-webkit-appearance:none;
        }
        .pr-input:focus,.pr-select:focus,.pr-textarea:focus {
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(45,140,240,.12);
        }
        .pr-textarea { resize:vertical;min-height:90px; }

        /* ── Two column grid ── */
        .pr-grid2 {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }
        @media(max-width:420px){ .pr-grid2{grid-template-columns:1fr;} }

        /* ── Urgency pills ── */
        .pr-urgency-row { display:flex;gap:8px; }
        .pr-urgency-btn {
            flex:1;padding:9px 6px;
            border-radius:var(--r-sm);
            border:1.5px solid var(--border2);
            background:var(--bg-white);color:var(--txt2);
            font-family:inherit;font-size:.75rem;font-weight:700;
            cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:5px;
            transition:border-color var(--ease),background var(--ease),color var(--ease);
        }
        .pr-urgency-btn.sel-high   { border-color:#ef4444;background:#fee2e2;color:#dc2626; }
        .pr-urgency-btn.sel-medium { border-color:#f59e0b;background:#fef3c7;color:#b45309; }
        .pr-urgency-btn.sel-low    { border-color:#16a34a;background:#dcfce7;color:#16a34a; }

        /* ── Submit ── */
        .pr-submit-btn {
            width:100%;height:48px;
            border-radius:var(--r-sm);
            background:linear-gradient(135deg,#1a55d4 0%,var(--primary) 100%);
            color:#fff;font-family:inherit;
            font-size:.9rem;font-weight:800;
            border:none;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:8px;
            box-shadow:0 4px 14px rgba(45,140,240,.35);
            transition:opacity var(--ease),transform var(--ease);
        }
        .pr-submit-btn:hover  { opacity:.92; }
        .pr-submit-btn:active { transform:scale(.98); }
        .pr-submit-btn:disabled { opacity:.6;cursor:not-allowed;transform:none; }

        /* ── History items ── */
        .pr-req-item {
            padding:12px;
            border-radius:var(--r-sm);
            border:1px solid var(--border);
            margin-bottom:10px;
            background:var(--bg);
        }
        .pr-req-item:last-child { margin-bottom:0; }
        .pr-req-name {
            font-size:.86rem;font-weight:800;color:var(--txt1);margin-bottom:5px;
        }
        .pr-req-meta {
            font-size:.7rem;font-weight:600;color:var(--txt3);
            display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;
        }
        .pr-req-meta i { margin-right:3px; }

        .pr-badge {
            display:inline-flex;align-items:center;gap:4px;
            padding:3px 10px;border-radius:50px;
            font-size:.62rem;font-weight:800;
        }
        .pr-badge-pending  { background:#fef3c7;color:#b45309; }
        .pr-badge-reviewed { background:#deeeff;color:var(--primary); }
        .pr-badge-completed{ background:#dcfce7;color:#16a34a; }

        .pr-req-reply {
            font-size:.75rem;font-weight:500;color:var(--txt2);
            background:var(--primary-faint);
            border:1px solid var(--primary-light);
            border-radius:var(--r-xs);
            padding:8px 10px;margin-top:8px;line-height:1.5;
        }
        .pr-req-reply strong { color:var(--primary);font-weight:800; }

        /* ── Empty / error states ── */
        .pr-empty {
            text-align:center;padding:28px 0;
            color:var(--txt3);font-size:.8rem;font-weight:600;
        }
        .pr-empty i { font-size:2rem;margin-bottom:8px;display:block;opacity:.4; }

        /* ── Toast ── */
        .pr-toast {
            position:fixed;bottom:calc(var(--bnh,64px) + 14px);left:50%;
            transform:translateX(-50%) translateY(12px);
            padding:10px 22px;border-radius:50px;
            font-size:.8rem;font-weight:700;
            white-space:nowrap;z-index:3000;
            opacity:0;pointer-events:none;
            background:var(--txt1);color:var(--bg-white);
            box-shadow:var(--sh-md);
            transition:opacity .22s ease,transform .22s ease;
            max-width:calc(100vw - 32px);text-align:center;
        }
        .pr-toast.show    { opacity:1;transform:translateX(-50%) translateY(0); }
        .pr-toast.success { background:#16a34a; }
        .pr-toast.error   { background:#dc2626; }
        .pr-toast.info    { background:var(--primary); }
    </style>
</head>
<body>

<!-- ════ SIDEBAR OVERLAY ════ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sbIdentity"></div>
    <nav class="sidebar-nav" id="sbNav"></nav></aside>

<!-- ════ HEADER ════ -->
<header class="header" id="mainHeader">
    <div class="header-inner">
        <div class="header-left">
            <button class="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
            <a href="index.html" class="header-brand">
                <span class="brand-print">Order</span>
                <span class="brand-badge"><span class="brand-badge-inner"><span class="brand-badge-front">my</span><span class="brand-badge-back"><img src="favicon.ico" alt=""></span></span></span>
                <span class="brand-xerox">xerox</span>
            </a>
        </div>
        <div class="header-right">
            <a href="cart.html" class="header-cart-btn" id="headerCartBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="header-cart-badge" id="headerCartBadge" style="display:none;"></span>
            </a>
            <a href="login.html" class="header-login-btn" id="headerLoginBtn">
                <i class="fa-regular fa-user"></i><span>Login</span>
            </a>
            <a href="profile.html" class="header-avatar-wrap" id="headerAvatarWrap" style="display:none;" title="My Account">
                <i class="fa-solid fa-user header-avatar-icon" id="headerAvatarIcon"></i>
            </a>
        </div>
    </div>
</header>

<!-- ════ MAIN ════ -->
<main class="main-content">
<div class="page-wrap">
<div class="pr-wrap">

    <!-- Hero -->
    <div class="pr-hero">
        <div class="pr-hero-icon"><i class="fa-solid fa-box-open"></i></div>
        <div>
            <div class="pr-hero-title">Request a Product</div>
            <div class="pr-hero-sub">Can't find what you need? Tell us and we'll try to add it to our inventory.</div>
        </div>
    </div>

    <!-- Form card -->
    <div class="pr-card">
        <div class="pr-card-title"><i class="fa-solid fa-pen-to-square"></i> Submit a New Request</div>

        <div class="pr-field">
            <label class="pr-label" for="prProductName">Product Name <span class="req">*</span></label>
            <input type="text" id="prProductName" class="pr-input"
                placeholder="e.g. Casio FX-991EX Calculator" maxlength="120">
        </div>

        <div class="pr-grid2">
            <div class="pr-field" style="margin-bottom:0;">
                <label class="pr-label" for="prCategory">Category <span class="req">*</span></label>
                <select id="prCategory" class="pr-select">
                    <option value="">— Select —</option>
                    <option value="books">Books</option>
                    <option value="stationary">Stationary</option>
                    <option value="electronic">Electronic / Kits</option>
                    <option value="posters">Wall Posters</option>
                    <option value="xerox">Xerox / Printing</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="pr-field" style="margin-bottom:0;">
                <label class="pr-label" for="prQty">Quantity <span class="req">*</span></label>
                <input type="number" id="prQty" class="pr-input"
                    placeholder="1" min="1" max="9999" value="1">
            </div>
        </div>

        <div class="pr-field" style="margin-top:14px;">
            <label class="pr-label" for="prDesc">Description / Notes</label>
            <textarea id="prDesc" class="pr-textarea"
                placeholder="Brand, model, colour, approximate price…"></textarea>
        </div>

        <div class="pr-field">
            <label class="pr-label">Urgency</label>
            <div class="pr-urgency-row">
                <button class="pr-urgency-btn sel-low" id="urgLow"
                    onclick="setUrgency('low')">
                    <i class="fa-solid fa-circle" style="font-size:.5rem;"></i> Low
                </button>
                <button class="pr-urgency-btn" id="urgMedium"
                    onclick="setUrgency('medium')">
                    <i class="fa-solid fa-circle" style="font-size:.5rem;"></i> Medium
                </button>
                <button class="pr-urgency-btn" id="urgHigh"
                    onclick="setUrgency('high')">
                    <i class="fa-solid fa-circle" style="font-size:.5rem;"></i> High
                </button>
            </div>
        </div>

        <button class="pr-submit-btn" id="prSubmitBtn" onclick="submitRequest()">
            <i class="fa-solid fa-paper-plane"></i> Submit Request
        </button>
    </div>

    <!-- History card -->
    <div class="pr-card">
        <div class="pr-card-title"><i class="fa-solid fa-clock-rotate-left"></i> Your Requests</div>
        <div id="prHistoryList">
            <div class="pr-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>
        </div>
    </div>

</div>
</div>
</main>

<!-- ════ BOTTOM NAV ════ -->
<nav class="bottom-nav" id="bottomNav">
    <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
    <a href="categories.html"  class="bottom-nav-item"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
    <a href="orders.html"      class="bottom-nav-item"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
    <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
</nav>

<div class="pr-toast" id="prToast"></div>

<script src="app.js"></script>
<script type="module" src="auth-header.js"></script>
<script type="module" src="product-request.js"></script>
</body>
</html>
