<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="head-cache.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Wall — JASA Essential</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="item-details.css?v=20261008a">
    <link rel="stylesheet" href="wall-builder.css?v=2">
    <meta name="theme-color" content="#2D8CF0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OrderXerox">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/android/launchericon-192x192.png">
</head>
<body>

    <header class="id-header">
        <button class="id-back-btn" id="wbBack" title="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 class="id-header-title" id="wbTitle">Build Your Wall</h1>
        <a href="cart.html" class="id-cart-btn" title="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="id-cart-badge" id="cartBadge" style="display:none;">0</span>
        </a>
    </header>

    <main class="id-main wb-main">
        <div class="id-section wb-msg" id="wbLoading">Loading…</div>
        <div class="id-section wb-msg" id="wbUnavailable" style="display:none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="wbUnavailableText">This is not available right now. Please check back soon.</span>
        </div>

        <div id="wbBody" style="display:none;">
            <div class="id-section wb-intro" id="wbIntro"></div>
            <div id="wbSteps"></div>

            <div class="id-section">
                <div class="wb-step-title"><span class="wb-num" id="wbFillNum">2</span> Tap each spot — pick a poster or add your photo</div>
                <div class="wb-tools">
                    <div class="wb-progress">
                        <span id="wbFilled">0 of 0 filled</span>
                        <div class="wb-bar"><i id="wbBar"></i></div>
                    </div>
                    <button type="button" class="wb-tool" id="wbAddPhotos"><i class="fa-regular fa-images"></i> Photos</button>
                    <button type="button" class="wb-tool" id="wbClear"><i class="fa-solid fa-rotate-left"></i> Clear</button>
                </div>
                <div class="wb-wall-scroll"><div class="wb-wall" id="wbWall"></div></div>
                <div class="wb-hint" id="wbWallHint"></div>
                <ul class="wb-notices" id="wbNotices"></ul>
            </div>
            <div style="height:120px;"></div>
        </div>
    </main>

    <!-- Price + add to cart -->
    <div class="wb-bar-bottom" id="wbBottom" style="display:none;">
        <div class="wb-price">
            <b id="wbPrice">₹0</b>
            <small><s id="wbPriceOrig"></s> <span id="wbSummary"></span></small>
        </div>
        <button type="button" class="wb-cta" id="wbAddCart">Add to cart</button>
    </div>

    <!-- Design picker -->
    <div class="wb-sheet-wrap" id="wbPicker" hidden>
        <div class="wb-sheet wb-picker" role="dialog" aria-modal="true" aria-labelledby="wbPickTitle">
            <div class="wb-sheet-head">
                <div>
                    <b id="wbPickTitle">Spot 1</b>
                    <small id="wbPickSub"></small>
                </div>
                <button type="button" class="wb-link" data-close>Done</button>
            </div>
            <div class="wb-bar"><i id="wbPickBar"></i></div>
            <button type="button" class="wb-photo-btn" id="wbPickPhoto">
                <span><i class="fa-solid fa-image"></i></span>
                <span><b>Upload your photo</b><small id="wbPickPhotoSub">From your gallery — we fit it to this poster</small></span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div class="wb-tabs" id="wbTabs"></div>
            <div class="wb-grid" id="wbGrid"></div>
        </div>
    </div>

    <!-- Spot actions -->
    <div class="wb-sheet-wrap" id="wbMenu" hidden>
        <div class="wb-sheet" role="dialog" aria-modal="true">
            <div class="wb-sheet-head"><div><b id="wbMenuTitle"></b><small id="wbMenuSub"></small></div></div>
            <div id="wbMenuActions"></div>
        </div>
    </div>

    <!-- Photo fit editor -->
    <div class="wb-crop" id="wbCrop" hidden role="dialog" aria-modal="true" aria-label="Fit your photo">
        <div class="wb-crop-head"><b id="wbCropTitle">Fit your photo</b><button type="button" id="wbCropReset"><i class="fa-solid fa-expand"></i> Reset</button></div>
        <div class="wb-crop-area" id="wbCropArea"><div class="wb-crop-frame" id="wbCropFrame"><img id="wbCropImg" alt="" draggable="false"></div></div>
        <div class="wb-crop-foot">
            <label class="wb-zoom"><i class="fa-solid fa-magnifying-glass-minus"></i><input type="range" id="wbCropZoom" min="0" max="100" value="0" aria-label="Zoom"><i class="fa-solid fa-magnifying-glass-plus"></i></label>
            <div class="wb-quality" id="wbCropQuality"></div>
            <div class="wb-crop-btns">
                <button type="button" class="wb-crop-cancel" id="wbCropCancel">Cancel</button>
                <button type="button" class="wb-crop-ok" id="wbCropOk">Use this photo</button>
            </div>
        </div>
    </div>

    <input type="file" id="wbFile" accept="image/jpeg,image/png,image/webp" hidden>
    <input type="file" id="wbFiles" accept="image/jpeg,image/png,image/webp" multiple hidden>

    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html"       class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="xerox-order.html" class="bottom-nav-item"><i class="fa-solid fa-print"></i><span>Xerox</span></a>
        <a href="categories.html"  class="bottom-nav-item active"><i class="fa-solid fa-border-all"></i><span>Categories</span></a>
        <a href="orders.html"      class="bottom-nav-item"><i class="fa-solid fa-file-lines"></i><span>Orders</span></a>
        <a href="profile.html"     class="bottom-nav-item"><i class="fa-regular fa-user"></i><span>Account</span></a>
    </nav>

    <div class="id-toast" id="idToast"></div>

    <script src="app.js"></script>
    <script src="wall-layouts.js?v=1"></script>
    <script type="module" src="wall-builder.js?v=1"></script>
</body>
</html>
